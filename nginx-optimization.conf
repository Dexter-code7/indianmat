# ==============================================================================
# High-Performance Nginx Configuration for India Weddings Matrimony
# Add these directives inside your server block in /etc/nginx/sites-available/...
# ==============================================================================

# 1. Enable GZIP & Pre-compressed Static Serving
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# Serve pre-compressed .gz files automatically if present
gzip_static on;

# 2. Immutable Long-Term Caching for Hashed Vite Assets (1 Year)
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# 3. Static Media Caching (30 Days)
location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, must-revalidate";
    access_log off;
    try_files $uri =404;
}

# 4. HTML Pages & Sitemaps (Fast revalidation)
location ~* \.(html|xml|txt)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# 5. Security Headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. 301 Redirects for Legacy / Underscore URLs to Canonical Clean URLs
location = /contact_us { return 301 /contact-us/; }
location = /contact_us/ { return 301 /contact-us/; }
location = /safe_matrimony { return 301 /safe-matrimony/; }
location = /safe_matrimony/ { return 301 /safe-matrimony/; }
location = /about_us { return 301 /about/; }
location = /about_us/ { return 301 /about/; }
location = /how_we_compare { return 301 /how-we-compare/; }
location = /how_we_compare/ { return 301 /how-we-compare/; }
location = /shorts { return 301 /social/; }
location = /shorts/ { return 301 /social/; }
location = /privacy_policy { return 301 /privacy-policy/; }
location = /privacy_policy/ { return 301 /privacy-policy/; }
location = /refund_policy { return 301 /refund-policy/; }
location = /refund_policy/ { return 301 /refund-policy/; }
location = /child_safety { return 301 /child-safety/; }
location = /child_safety/ { return 301 /child-safety/; }
location = /subscription_plan { return 301 /subscription-plan/; }
location = /subscription_plan/ { return 301 /subscription-plan/; }
location = /terms { return 301 /terms-and-conditions/; }
location = /terms/ { return 301 /terms-and-conditions/; }
location = /terms_and_conditions { return 301 /terms-and-conditions/; }
location = /terms_and_conditions/ { return 301 /terms-and-conditions/; }
location = /success_stories { return 301 /success-stories/; }
location = /success_stories/ { return 301 /success-stories/; }

